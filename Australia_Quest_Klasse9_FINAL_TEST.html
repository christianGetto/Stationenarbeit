if(active===5){html+=`<label>Choose the signal word</label><div class="options">${q.opts.map(w=>`<button class="option ${a.signal===w?'selected':''}" onclick="signalSelect(${i},'${w}')">${w}</button>`).join('')}</div><label>Build the sentence</label><div class="answerbox">${(a.order||[]).map(idx=>`<button class="chip selected" onclick="removeTile(${i},${idx})">${esc(idx===q.tiles.length?a.signal:q.tiles[idx])}</button>`).join('')}${a.signal&&(a.order||[]).includes(q.tiles.length)?'':''}</div><div class="options">${[...q.tiles,...(a.signal?[a.signal]:[])].map((w,j)=>(a.order||[]).includes(j)?'':`<button class="chip" onclick="addTile(${i},${j})">${esc(w)}</button>`).join('')}</div><button class="btn ghost" onclick="answer(${i},'order',[]);render()">Reset cards</button>`}
html+='</section>'});html+=`</div><div class="footer"><button class="btn ghost" ${active===0?'disabled':''} onclick="go(${active-1})">← Previous</button>${active===6?'<button class="btn alt" onclick="submitTest()">Submit test ✓</button>':`<button class="btn" onclick="go(${active+1})">Next →</button>`}</div><p class="small muted">Your answers are saved automatically on this device. No grammar corrections are shown during the test.</p>`;app.innerHTML=html}
function signalSelect(i,w){let a=state.answers[active][i];a.signal=w;a.order=[];if(!teacher)save();render()}
function addTile(i,j){let a=state.answers[active][i];a.order=a.order||[];if(!a.order.includes(j))a.order.push(j);if(!teacher)save();render()}
function removeTile(i,j){let a=state.answers[active][i];a.order=(a.order||[]).filter(x=>x!==j);if(!teacher)save();render()}
function punctuationWarnings(){if(active!==3)return[];let issues=[];state.answers[3].forEach((a,i)=>{if(!a.question?.trim()&&!a.short?.trim())return;let miss=[];if(a.question?.trim()&&!a.question.trim().endsWith('?'))miss.push('question mark (?)');if(a.short?.trim()){if(!/^\s*(yes|no)\s*,/i.test(a.short))miss.push('comma (,) after Yes/No');if(!a.short.trim().endsWith('.'))miss.push('full stop (.)')}if(miss.length)issues.push('Sentence '+(i+1)+': '+miss.join(', '))});return issues}
function go(n){if(n<0||n>6)return;if(n>active){let issues=punctuationWarnings();if(issues.length&&!confirm('Please check your punctuation before you continue:\n\n'+issues.join('\n')+'\n\nPress Cancel to correct it, or OK to continue.'))return}active=n;render();scrollTo(0,0)}
function mark(q,a,t){if(t===0)return (state.lrs?normGrammar(a.text)===normGrammar(q.a):String(a.text||'').trim()===q.a)?1:0;if(t===1)return (state.lrs?normGrammar(a.text)===normGrammar(q.a):String(a.text||'').trim().replace(/[‘’´`ʼ]/g,"'").replace(/\b(don|doesn|isn|aren)\s*['`]\s*t\b/gi,"$1't").replace(/\s+/g,' ').replace(/doesn't/g,'does not').replace(/don't/g,'do not').replace(/isn't/g,'is not').replace(/aren't/g,'are not')===q.a)?1:0;if(t===2)return (state.lrs?normalize(a.text)===normalize(q.a):String(a.text||'').trim()===q.a)?1:0;if(t===3){const question=punctless(a.question)===punctless(q.question)?1:0;const short=punctless(a.short)===punctless(q.short)?1:0;return question+short}if(t===4)return a.text===q.a?1:0;if(t===5){const assembled=(a.order||[]).map(idx=>idx===q.tiles.length?a.signal:q.tiles[idx]).join(' ').replace(/\s+\./g,'.');return a.signal===q.signal&&(a.order||[]).length===q.tiles.length+1&&normalize(assembled)===normalize(q.a)?1:0}if(t===6)return (state.lrs?punctless(a.text)===punctless(q.a):String(a.text||'').trim().replace(/[‘’´`ʼ]/g,"'").replace(/\b(don|doesn|isn|aren)\s*['`]\s*t\b/gi,"$1't").replace(/[?.!,]/g,'').replace(/\s+/g,' ').trim()===q.a.replace(/[?.!,]/g,''))?1:0;return 0}
function evaluate(){let breakdown=state.tasks.map((task,t)=>task.map((q,i)=>mark(q,state.answers[t][i],t)));return{breakdown,points:breakdown.flat().reduce((a,b)=>a+b,0)}}
function submitTest(){if(!confirm('Submit your test now? You cannot change your answers afterwards.'))return;const issues=punctuationWarnings();if(issues.length&&!confirm('Punctuation reminder:\n'+issues.join('\n')+'\n\nSubmit anyway?'))return;state.submitted=true;state.finished=Date.now();state.evaluation=evaluate();save();result();if(!teacher)upload()}
function result(){const ev=state.evaluation||evaluate(),grade=gradePct(ev.points,TOTAL);let html=`<div class="hero"><h1>🏆 Test submitted</h1><p>${esc(state.first)} ${esc(state.last)} · ${esc(state.klasse)}</p></div><div class="card"><h2>${ev.points} / ${TOTAL} points · Grade ${grade}</h2>${state.lrs?'<div class="notice">LRS: Schreibweisen und Grenzfälle müssen von der Lehrkraft geprüft und gegebenenfalls nachkorrigiert werden. Die automatische Punktzahl ist vorläufig.</div>':''}<div class="notice" style="font-size:19px;font-weight:800">ACHTUNG: DIE ANGEZEIGTE NOTE IST NUR VORLÄUFIG! Die Lehrkraft überprüft deine Arbeit. Erst danach steht die endgültige Note fest.</div><div id="uploadstatus" class="notice">${state.upload==='ok'?'Ergebnis und Korrektur-JPEG wurden bestätigt gespeichert.':'Speicherung wird überprüft. Bitte diese Seite nicht schließen.'}</div><button class="btn" onclick="downloadJPEG()">Download correction JPEG</button> <button class="btn ghost" onclick="upload()">Retry upload</button></div><div class="card"><h2>Correction</h2>`;
state.tasks.forEach((task,t)=>{html+=`<h3>Task ${t+1}: ${ev.breakdown[t].reduce((a,b)=>a+b,0)} / ${CONFIG.max[t]}</h3>`;task.forEach((q,i)=>{let a=state.answers[t][i],correct=t===3?q.question+' / '+q.short:t===5?q.a:q.a,got=t===3?(a.question||'—')+' / '+(a.short||'—'):t===5?(a.order||[]).map(idx=>idx===q.tiles.length?a.signal:q.tiles[idx]).join(' '):a.text||'—';html+=`<div class="review"><div>${i+1}. ${esc(t===3?q.words.join(' / '):t===5?'Signal: '+q.clue:q.q)}</div><div><b>Your answer:</b> ${esc(got)} <span class="${ev.breakdown[t][i]===CONFIG.max[t]/CONFIG.counts[t]?'ok':'error'}">${ev.breakdown[t][i]} pt</span></div><div><b>Correct:</b> ${esc(correct)}</div></div>`})});html+='</div>';app.innerHTML=html}
function jpegData(){const ev=state.evaluation||evaluate();const lines=[CONFIG.title,'Name: '+state.first+' '+state.last+' | Class: '+state.klasse+' | LRS: '+(state.lrs?'Yes':'No'),'Submitted: '+new Date(state.finished||Date.now()).toLocaleString('de-DE'),'Points: '+ev.points+' / '+TOTAL+' | Provisional grade: '+gradePct(ev.points,TOTAL),'ATTENTION: PROVISIONAL GRADE — TEACHER REVIEW REQUIRED','Security events: verlassen='+state.events.verlassen+' split='+state.events.split,''];state.tasks.forEach((task,t)=>{lines.push('TASK '+(t+1)+' — '+ev.breakdown[t].reduce((a,b)=>a+b,0)+'/'+CONFIG.max[t]);task.forEach((q,i)=>{const a=state.answers[t][i];const given=t===3?(a.question||'—')+' / '+(a.short||'—'):t===5?(a.order||[]).map(idx=>idx===q.tiles.length?a.signal:q.tiles[idx]).join(' '):a.text||'—';lines.push((i+1)+'. '+(t===3?q.words.join(' / '):t===5?'Signal '+q.clue:q.q));lines.push('   Student: '+given+' | '+ev.breakdown[t][i]+' point(s)');lines.push('   Correct: '+(t===3?q.question+' / '+q.short:q.a))});lines.push('')});const c=document.createElement('canvas'),ctx=c.getContext('2d');const width=1250,margin=40,lineH=25;ctx.font='18px Arial';const wrapped=[];for(const line of lines){let remaining=line;if(!remaining){wrapped.push('');continue}while(remaining.length){let end=remaining.length;while(ctx.measureText(remaining.slice(0,end)).width>width-margin*2&&end>1)end--;if(end<remaining.length){let split=remaining.lastIndexOf(' ',end);if(split>10)end=split}wrapped.push(remaining.slice(0,end));remaining=remaining.slice(end).trimStart()}}c.width=width;c.height=Math.max(800,wrapped.length*lineH+100);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#18364a';ctx.font='18px Arial';wrapped.forEach((s,i)=>ctx.fillText(s,margin,margin+22+i*lineH));return c.toDataURL('image/jpeg',.82)}
function downloadJPEG(){const link=document.createElement('a');link.href=jpegData();link.download='Australia_Quest_'+state.klasse+'_'+state.last+'.jpg';link.click()}
async function upload(){if(!state?.submitted||teacher)return;const status=document.getElementById('uploadstatus');if(status)status.textContent='Übertragung läuft. Bitte warten …';const ev=state.evaluation;const payload={attemptId:state.attemptId,checkToken:state.checkToken,klasse:state.klasse,test:CONFIG.testId,kuerzel:state.first+' '+state.last,punkte:ev.points,maxPunkte:TOTAL,note:gradePct(ev.points,TOTAL),lrs:state.lrs,verlassen:state.events.verlassen,split:state.events.split,jpeg:jpegData()};try{await fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});await verifyUpload()}catch(e){state.upload='error';save();if(status)status.innerHTML='<b>NICHT BESTÄTIGT GESPEICHERT!</b> Internet prüfen und „Retry upload“ antippen.'}}
function verifyUpload(){return new Promise(resolve=>{const callback='ppStatus_'+state.attemptId.slice(0,24),script=document.createElement('script');let finished=false;const done=ok=>{if(finished)return;finished=true;delete window[callback];script.remove();state.upload=ok?'ok':'error';save();const status=document.getElementById('uploadstatus');if(status)status.innerHTML=ok?'<b class="ok">Ergebnis und Korrektur-JPEG erfolgreich in Google Sheets / Drive bestätigt.</b>':'<b class="error">SPEICHERUNG NICHT BESTÄTIGT! Bitte erneut versuchen. Seite nicht schließen.</b>';resolve(ok)};window[callback]=d=>done(!!d.success);script.onerror=()=>done(false);script.src=CONFIG.endpoint+'?callback='+callback+'&id='+encodeURIComponent(state.attemptId)+'&token='+encodeURIComponent(state.checkToken)+'&r='+Date.now();document.head.appendChild(script);setTimeout(()=>done(false),16000)})}
window.addEventListener('blur',()=>{if(state&&!state.submitted&&!teacher){state.events.blur++;state.events.verlassen++;save()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state&&!state.submitted&&!teacher){state.events.verlassen++;save()}});function splitCheck(){if(state&&!state.submitted&&!teacher&&innerWidth<650&&screen.width>850){state.events.split++;save()}}window.addEventListener('resize',splitCheck);window.addEventListener('beforeunload',e=>{if(state&&!state.submitted&&!teacher){e.preventDefault();e.returnValue=''}});
document.addEventListener('copy',e=>{if(state&&!state.submitted&&!teacher)e.preventDefault()});document.addEventListener('paste',e=>{if(state&&!state.submitted&&!teacher)e.preventDefault()});document.addEventListener('cut',e=>{if(state&&!state.submitted&&!teacher)e.preventDefault()});document.addEventListener('contextmenu',e=>{if(state&&!state.submitted&&!teacher)e.preventDefault()});
state=load();if(state?.submitted&&state.upload!=='ok'){result();upload()}else if(state&&!state.submitted){app.innerHTML=`<div class="hero"><h1>🦘 Australia Quest</h1></div><div class="card"><h2>Unfinished test found</h2><p>Eine begonnene Arbeit wurde auf diesem Gerät gefunden. Die Wiederaufnahme benötigt eine ausdrückliche Lehrerfreigabe.</p><button class="btn" onclick="resume()">Teacher-approved resume</button></div>`}else if(state?.submitted)result();else intro();function resume(){const p=prompt('Lehrerpasswort für Wiederaufnahme');if(p===CONFIG.teacherPassword){active=0;render()}else alert('Keine Freigabe')}
</script></body></html>
